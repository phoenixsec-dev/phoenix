services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: synthetic-pg-initial
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "synthetic-redis"]
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-16379}:6379"

  miniflux:
    image: miniflux/miniflux:2.2.13
    environment:
      DATABASE_URL: postgres://testuser:synthetic-pg-initial@postgres/testdb?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: synthetic-admin
      ADMIN_PASSWORD: synthetic-miniflux
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${E2E_MINIFLUX_PORT:-18090}:8080"
