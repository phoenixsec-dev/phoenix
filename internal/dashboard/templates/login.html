<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" .}}
    <title>Phoenix - Sign in</title>
</head>
<body class="login-body">
    <div class="login-card">
        <img src="/dashboard/static/phoenix-icon.svg" alt="" class="login-icon">
        <h1 class="login-title">Phoenix</h1>
        {{if .Error}}<div class="flash flash-error">{{.Error}}</div>{{end}}
        <form method="POST" action="/dashboard/login">
            <input type="password" name="credential" placeholder="Password" aria-label="Password" class="input" autocomplete="current-password" autofocus required>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div>
</body>
</html>
