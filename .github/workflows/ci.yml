name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      # Pinned, not @latest. staticcheck v0.8.0 requires Go >= 1.26, which
      # this job cannot satisfy under GOTOOLCHAIN=local, so @latest breaks the
      # build the moment upstream releases ahead of our Go matrix. Bump this
      # deliberately alongside go-version.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Test
        run: go test ./... -count=1 -race -timeout 120s

      - name: Build
        run: |
          go build -o bin/phoenix ./cmd/phoenix/
          go build -o bin/phoenix-server ./cmd/phoenix-server/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "Files not formatted:"
            echo "$gofmt_output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  # Builds the release Docker image for both platforms without pushing, so
  # a broken Dockerfile shows up on the PR instead of at release time.
  # Publishing happens only in release.yml, on a version tag.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
