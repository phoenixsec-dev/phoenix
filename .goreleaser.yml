version: 2

# Pinned so archive names never depend on the checkout directory or remote
# name. scripts/install.sh builds the same name: phoenix_<version>_<os>_<arch>,
# where <version> has NO leading "v" (tag v0.17.0 -> phoenix_0.17.0_...).
project_name: phoenix

builds:
  - id: phoenix
    main: ./cmd/phoenix/
    binary: phoenix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: phoenix-server
    main: ./cmd/phoenix-server/
    binary: phoenix-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  # Tags like v0.18.0-rc1 publish as GitHub pre-releases. Pre-releases are
  # never returned by /releases/latest, so scripts/install.sh (default
  # PHOENIX_VERSION=latest) only ever installs a final release.
  prerelease: auto
